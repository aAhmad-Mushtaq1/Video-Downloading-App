name: video_downloader
description: A stunning cross-platform video downloader app with premium UI supporting 1700+ websites
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # HTTP & Networking
  dio: ^5.4.0
  http: ^1.1.2
  
  # Storage & File Management
  path_provider: ^2.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^11.1.0
  
  # UI Components & Animations
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  
  # Utilities
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  intl: ^0.18.1
  
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
